name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy via SSH
        uses: appleboy/scp-action@master
        with:
          host: 35.212.185.16
          username: yslproducts2026
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "."
          target: "/home/yslproducts2026/henry-vlog"
          strip_components: 0
          overwrite: true

      - name: Run git pull on VPS
        uses: appleboy/ssh-action@master
        with:
          host: 35.212.185.16
          username: yslproducts2026
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/yslproducts2026/henry-vlog
            git pull origin main
