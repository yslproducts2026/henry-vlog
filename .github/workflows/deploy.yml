name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 35.212.185.16
          username: yslproducts2026
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "."
          target: /home/yslproducts2026/henry-vlog
          strip_components: 0
          overwrite: true
          timeout: 120s

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 35.212.185.16
          username: yslproducts2026
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            ls -la /home/yslproducts2026/henry-vlog/
            echo "Deployment complete!"
